<!DOCTYPE html>
<html lang="km">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0b0d13;
            font-family: Arial, sans-serif;
        }

        .payment-modal {
            background: #171d30;
            color: #fff;
            border: 1px solid #34405c;
            border-radius: 18px;
            max-width: 500px;
            margin: 50px auto;
            overflow: hidden;
        }

        .modal-header-custom {
            padding: 20px;
            border-bottom: 1px solid #30384f;
        }

        .modal-body-custom {
            padding: 25px;
        }

        .close-btn {
            color: #999;
            font-size: 28px;
            cursor: pointer;
        }

        .amount-btn {
            background: #222b45;
            border: 1px solid #394563;
            color: #eee;
            border-radius: 10px;
            padding: 10px;
            font-size: 18px;
            width: 100%;
        }

        .amount-btn:hover,
        .amount-btn.active {
            background: #303b59;
            border-color: #f0b43c;
            color: #fff;
        }

        .payment-method {
            background: #222b45;
            border: 1px solid #f0b43c;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
        }

        .aba-logo {
            width: 8px;
            height: 8px;
            border-radius: 7px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            line-height: 1;
        }

        .aba-logo img {
            width: 50px;
            height: 50px;
            margin-left: 40px;
            border-radius: 7px;
        }

        .radio {
            width: 22px;
            height: 22px;
            border: 3px solid #f0b43c;
            border-radius: 50%;
            margin-left: auto;
            position: relative;
            
        }

        .radio::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            background: #f0b43c;
            border-radius: 50%;
            top: 3.5px;
            left: 4px;
        }

        .custom-input {
            background: #222b45;
            border: 1px solid #394563;
            color: white;
            border-radius: 10px;
            padding: 14px;
            font-size: 20px;
        }

        .custom-input:focus {
            background: #222b45;
            color: white;
            /* border-color: #f0b43c; */
            box-shadow: none;
        }

        .form-check-input {
            background-color: #f0b43c;
            border-color: #f0b43c;
        }

        .pay-btn {
            background: #f0b43c;
            border: none;
            color: #111;
            font-weight: bold;
            font-size: 20px;
            padding: 14px;
            border-radius: 10px;
            width: 100%;
        }

        .pay-btn:hover {
            background: #ffc34d;
        }

        .text-gray {
            color: #9da3b5;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="payment-modal">

            <!-- Header -->
            <div class="modal-header-custom d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold">Pay Ment</h5>

                <span class="close-btn">&times;</span>
            </div>

            <!-- Body -->
            <div class="modal-body-custom">

                <p class="mb-3">
                    Select Pay Ment
                </p>

                <!-- Amount Buttons -->
                <div class="row g-2 mb-4">

                    <div class="col-3">
                        <button class="amount-btn">$0.25</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$0.50</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$1.00</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$1.50</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$2.00</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$3.00</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$5.00</button>
                    </div>

                    <div class="col-3">
                        <button class="amount-btn">$10.00</button>
                    </div>

                </div>

                <!-- Payment Method -->
                <h6 class="mb-3">
                    select compeny pay
                </h6>
                <a href="../photo_2026-10-04_03-48-00.jpg" class=" text-decoration-none">
                    <div class="payment-method d-flex align-items-center mb-4">

                        <div class="aba-logo me-3 ">
                            <img style="margin-top: 60px;" src="https://toanchetpay.acledabank.com.kh/toanchetpay/assets/imgs/demo-icons/icon-demo-khqr.png"
                                alt="">
                        </div>

                        <div style="margin-left: 60px;">
                            <h5 class="mb-1 text-secondary">KHQR</h5>
                            <span class="text-gray">
                                Scan to pay with any banking app
                            </span>
                        </div>
                </a>
                <div class="radio"></div>

            </div>

            <!-- Custom Amount -->
            <h6 class="mb-3">
                ទឹកប្រាក់ដែលត្រូវបង់
            </h6>

            <div class="input-group mb-4">
                <span class="input-group-text custom-input border-end-0">$</span>

                <input type="number" id="amount" class="form-control custom-input border-start-0" placeholder="0.00"
                    min="0">
            </div>

            <!-- Checkbox -->
            <div class="form-check mb-5">

                <input class="form-check-input" type="checkbox" id="confirm">

                <label class="form-check-label text-gray" for="confirm">
                    ខ្ញុំយល់ព្រមតាម
                    <u>លក្ខខណ្ឌការទូទាត់</u>
                </label>

            </div>

            <!-- Pay Button -->
            <button id="payBtn" class="pay-btn">
                ទូទាត់ប្រាក់
            </button>

        </div>
    </div>

    </div>


    <!-- JavaScript -->
    <script>

        const amountButtons =
            document.querySelectorAll(".amount-btn");

        const amountInput =
            document.getElementById("amount");

        const confirm =
            document.getElementById("confirm");

        const payBtn =
            document.getElementById("payBtn");


        // Select amount
        amountButtons.forEach(button => {

            button.addEventListener("click", function () {

                // Remove active
                amountButtons.forEach(btn => {
                    btn.classList.remove("active");
                });

                // Add active
                this.classList.add("active");

                // Get amount
                let amount = this.innerText.replace("$", "");

                // Put amount in input
                amountInput.value = amount;
            });

        });


        // Pay
        payBtn.addEventListener("click", function () {

            let amount = parseFloat(amountInput.value);

            if (!amount || amount <= 0) {
                alert("សូមបញ្ចូលចំនួនទឹកប្រាក់!");
                return;
            }

            if (!confirm.checked) {
                alert("សូមយល់ព្រមតាមលក្ខខណ្ឌការទូទាត់!");
                return;
            }

            alert("កំពុងទូទាត់ $" + amount.toFixed(2));

            // Here you can connect PHP / Database / ABA KHQR
        });

    </script>

</body>

</html>
